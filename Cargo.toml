[workspace]
resolver = "3"
members = [
    "crates/rostdav-core",
    "crates/rostdav-meta",
    "crates/rostdav-storage",
    "crates/rostdav-app",
    "crates/rostdav-dav",
    "crates/rostdav-compat",
    "crates/rostdav-web",
    "crates/rostdav",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pierrejochem/rostdav"
homepage = "https://pierrejochem.github.io/rostdav/"
documentation = "https://pierrejochem.github.io/rostdav/"
rust-version = "1.85"
# Internal crates; the binary is what gets shipped.
publish = false

[workspace.dependencies]
rostdav-core = { path = "crates/rostdav-core" }
rostdav-meta = { path = "crates/rostdav-meta" }
rostdav-storage = { path = "crates/rostdav-storage" }
rostdav-app = { path = "crates/rostdav-app" }
rostdav-dav = { path = "crates/rostdav-dav" }
rostdav-compat = { path = "crates/rostdav-compat" }
rostdav-web = { path = "crates/rostdav-web" }

anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turso = "=0.8.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "sensitive-headers", "limit", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tempfile = "3"
unicode-normalization = "0.1"
percent-encoding = "2"
quick-xml = "0.42"
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
mime_guess = "2"
base64 = "0.22"
futures-core = "0.3"
blake3 = "1"
argon2 = { version = "0.5", features = ["std"] }
ulid = "3"
chacha20poly1305 = "0.10"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"

# Password hashing is unusably slow unoptimized; keep tests quick.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.blake3]
opt-level = 3
