# Documentation and user manual of Rostdav (GitHub Pages). Built with Zola:
#   python3 ../scripts/site-sync.py && zola build     (or: just site)
base_url = "https://pierrejochem.github.io/rostdav"
title = "Rostdav"
description = "Rostdav is a lean, self-hosted file server written in Rust. WebDAV, sharing, versions and trash, and it works with the official Nextcloud apps."
default_language = "en"
generate_robots_txt = true
build_search_index = false
minify_html = true

[markdown]
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = false

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
repo = "https://github.com/pierrejochem/rostdav"
releases = "https://github.com/pierrejochem/rostdav/releases"
image = "/media/social.png"
