# Live development: edit the code on the host, the server rebuilds and restarts
# (like a Vite dev server, but for Rust).
#
#   docker compose up --build
#   open http://localhost:8080   (user: demo, password: korrekt-pferd-batterie)
#
# Note: on Docker Desktop, a tool that replaces a file instead of writing into it
# (for example `sed -i`) may not show up in the container. If the server does not
# pick up a change, save the file again from your editor or run `docker compose restart`.
#
# Data lives in the named volume `rostdav-data`; `down -v` resets it.
services:
  rostdav:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      ROSTDAV_SERVER__LISTEN: "0.0.0.0:8080"
      ROSTDAV_STORAGE__DATA_DIR: /data
      ROSTDAV_LOG__FORMAT: pretty
      ROSTDAV_LOG__LEVEL: info,rostdav=debug
    volumes:
      - .:/app
      - rostdav-data:/data
      - cargo-registry:/usr/local/cargo/registry
      # build output stays in a volume: fast and not mixed with host builds
      - cargo-target:/app/target

volumes:
  rostdav-data:
  cargo-registry:
  cargo-target:
