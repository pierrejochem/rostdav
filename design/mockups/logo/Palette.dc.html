<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rostdav Colors and Typography</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2491D}a:hover{color:#7A2A12}
</style>
</helmet>
<div style="width: 1200px; height: 420px; box-sizing: border-box; padding: 40px; background: #F4EFE8; display: flex; flex-direction: column; gap: 28px; font-family: 'Space Grotesk', system-ui, sans-serif; color: #15171C">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #15171C"></div><div style="font-weight: 700; font-size: 16px">Iron</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#15171C</div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #7A2A12"></div><div style="font-weight: 700; font-size: 16px">Oxide</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#7A2A12</div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #C2491D"></div><div style="font-weight: 700; font-size: 16px">Rust</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#C2491D</div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #E8783A"></div><div style="font-weight: 700; font-size: 16px">Copper</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#E8783A</div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #F2A65A"></div><div style="font-weight: 700; font-size: 16px">Ember</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#F2A65A</div></div>
<div style="display: flex; flex-direction: column; gap: 10px"><div style="height: 120px; border-radius: 14px; background: #F4EFE8; box-shadow: inset 0 0 0 1px #CFC5B9"></div><div style="font-weight: 700; font-size: 16px">Ivory</div><div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: #5A5550">#F4EFE8</div></div>
</div>
<div style="display: flex; gap: 64px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 44px; font-weight: 700; letter-spacing: -1.5px; line-height: 1">Space Grotesk</div>
<div style="font-size: 15px; color: #5A5550">Wordmark and headings · 700, tight tracking</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; font-weight: 500; line-height: 1.2">JetBrains Mono</div>
<div style="font-size: 15px; color: #5A5550">Tagline, code, technical labels · 500</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
