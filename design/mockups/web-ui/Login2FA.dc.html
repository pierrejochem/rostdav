<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rostdav – Second Factor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F2A65A}a:hover{color:#F7C589}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit}
</style>
</helmet>
<div style="min-height: 900px; background: #15171C; color: #F4EFE8; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 48px 16px; box-sizing: border-box">

<div style="display: flex; align-items: center; gap: 14px">
<svg viewBox="0 0 140 128" width="56" height="51" aria-hidden="true">
<path d="M18 34a8 8 0 0 1 8-8h22l8 9h44a8 8 0 0 1 8 8v51a8 8 0 0 1-8 8H26a8 8 0 0 1-8-8Z" fill="#7A2A12"></path>
<path d="M33 50h75a4 4 0 0 1 3.9 4.8l-9 44A4 4 0 0 1 99 102H24a4 4 0 0 1-3.9-4.8l9-44A4 4 0 0 1 33 50Z" fill="#C2491D"></path>
<path d="M33 50h75a4 4 0 0 1 3.9 4.8l-0.6 3.2H28.4l0.7-3.2A4 4 0 0 1 33 50Z" fill="#E8783A"></path>
<rect x="110" y="84" width="9" height="9" rx="2" fill="#E8783A" transform="rotate(12 114.5 88.5)"></rect>
<rect x="122" y="70" width="6" height="6" rx="1.5" fill="#F2A65A" transform="rotate(24 125 73)"></rect>
<rect x="130" y="58" width="4" height="4" rx="1" fill="#F7C589" transform="rotate(36 132 60)"></rect>
</svg>
<span style="font-size: 36px; font-weight: 700; letter-spacing: -1.5px"><span style="color: #F4EFE8">rost</span><span style="color: #E8783A">dav</span></span>
</div>

<div style="width: 100%; max-width: 440px; background: #1F2229; border: 1px solid #2E313A; border-radius: 20px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #C9C2B9">
<span style="height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 13px; background: #2A2D35; color: #E9E3DB; font-weight: 600">Step 2 of 2</span>
<span>Nextcloud Android</span>
</div>
<div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.8px">{{heading}}</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: #C9C2B9">{{lead}}</p>
</div>
<form style="display: flex; flex-direction: column; gap: 14px">
<sc-if value="{{useTotp}}" hint-placeholder-val="{{true}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Code from the authenticator app
<input type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="min-height: 60px; padding: 0 16px; border-radius: 12px; border: 1px solid #3A3D45; background: #15171C; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 28px; letter-spacing: 12px; text-align: center; color: #F4EFE8">
</label>
</sc-if>
<sc-if value="{{useRecovery}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Recovery code
<input type="text" autocomplete="off" placeholder="xxxx-xxxx-xxxx" style="min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid #3A3D45; background: #15171C; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px; letter-spacing: 2px; color: #F4EFE8">
</label>
</sc-if>
<button type="button" style="min-height: 50px; margin-top: 6px; border-radius: 12px; border: none; background: #C2491D; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">Confirm and allow access</button>
<button type="button" onClick="{{toggle}}" style="min-height: 44px; border-radius: 12px; border: none; background: transparent; color: #F2A65A; font-weight: 600; cursor: pointer">{{toggleLabel}}</button>
</form>
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.5; color: #A8A29C">
<svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 2px"><path d="M12 21a9 9 0 1 0 0-18a9 9 0 0 0 0 18Z"></path><path d="M12 7v5l3 2"></path></svg>
<span>After five wrong codes, sign-in is locked for a few minutes.</span>
</div>
</div>

<a href="Login.dc.html" style="font-size: 14px; font-weight: 600">Back to sign-in</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { recovery: false };
}
renderVals() {
const r = this.state.recovery;
return {
useTotp: !r,
useRecovery: r,
heading: r ? 'Recovery code' : 'Confirm your sign-in',
lead: r ? 'Each code works only once. Afterwards you will see how many are left.' : 'Enter the six-digit code from your authenticator app.',
toggleLabel: r ? 'Use the authenticator app instead' : 'No access to the app? Use a recovery code',
toggle: () => this.setState({ recovery: !r })
};
}
}
</script>
</body>
</html>
