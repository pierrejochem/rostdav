# Example configuration for Rostdav.
# Copy to rostdav.toml. Every value can be overridden via environment
# variables: ROSTDAV_<SECTION>__<KEY>, e.g. ROSTDAV_SERVER__LISTEN.

[server]
# HTTP without TLS; in production behind a reverse proxy.
listen = "127.0.0.1:8080"
# Externally visible URL; set it when running behind a TLS-terminating proxy.
# public_url = "https://cloud.example.org"
# Reverse proxies whose X-Forwarded-For header is trusted (client IP for rate limiting).
# trusted_proxies = ["127.0.0.1"]

[storage]
# Contains blobs/, tmp/, uploads/ and db/. Created with mode 0700.
data_dir = "./data"

[database]
# If omitted: sqlite://<data_dir>/db/rostdav.sqlite (the file is SQLite's format, written by the
# Turso Database engine)
# url = "sqlite:///srv/rostdav/db/rostdav.sqlite"

[compat]
# What clients are told about the server (status.php, capabilities).
# reported_version = "35.0.2.2"
# product_name = "Rostdav"

[audit]
# Event log (rostdav admin audit export). Shorten stored client addresses:
# anonymize_ip = false
# Delete events older than this many days (0 = keep everything):
# retention_days = 365

[versioning]
# Keep the previous content of overwritten files (counts toward the quota).
# enabled = true
# Versions kept per file (0 = unlimited), maximum age in days (0 = keep),
# and the share of a user's quota that versions may use (0 = no limit).
# max_versions = 50
# max_age_days = 365
# max_quota_share_percent = 50

[trash]
# Deleted files go to the trash first; their space counts until it is emptied.
# enabled = true
# Items older than this many days are deleted for good (0 = keep until emptied).
# retention_days = 30

[web]
# Browser sessions of the web interface end after this many hours without activity ...
# session_idle_hours = 8
# ... or after this many days at the latest.
# session_max_days = 14

[security]
# Key for the two-factor secrets (32 random bytes, base64). Prefer the environment
# variable ROSTDAV_SECURITY__TOTP_KEY to a value here.
# totp_key = "..."
# Or a file with the 32 raw bytes. Default: totp.key in the data directory, created
# when the first user starts a two-factor setup. Back it up with the data.
# totp_key_file = "/var/lib/rostdav/totp.key"

[mfa]
# Push sign-in approval with the RustMFA app (ADR 0014).
# Seconds a sign-in challenge can be answered (10 to 300, default 90).
# challenge_ttl_seconds = 90
# Seconds an enrollment QR code stays valid (60 to 900, default 300).
# enroll_ttl_seconds = 300
# Service identifier signed into every challenge (A-Z a-z 0-9 . _ -, up to 64 characters).
# audience = "rostdav"
# "required": a phone must prove a hardware-backed key when it registers.
# "off": no check, for custom ROMs without Google key attestation.
# attestation = "required"

[mfa.fcm]
# Wake phones through Firebase Cloud Messaging when a sign-in approval waits. Off unless both keys
# are set. The file is a Google service-account key (JSON) with the role "Firebase Cloud
# Messaging API Admin"; keep it readable for the Rostdav user only. Without FCM a phone sees a
# request when its app polls.
# project_id = "my-firebase-project"
# service_account_file = "/etc/rostdav/fcm-service-account.json"

[limits]
# Maximum size of a single upload in bytes (default: 16 GiB).
# max_upload_bytes = 17179869184
# Maximum size of one chunk of a chunked upload (default: 100 MiB).
# max_chunk_bytes = 104857600
# Unfinished chunked uploads are removed after this many hours (default: 24).
# upload_retention_hours = 24
# Quota of users created from now on: 10G, 500M, bytes or unlimited (default).
# default_quota = "unlimited"

[log]
# "json" for production, "pretty" for development.
format = "json"
# Filter as for RUST_LOG, e.g. "info,rostdav=debug".
level = "info"
