# Beispielkonfiguration für Rostdav.
# Kopieren nach rostdav.toml. Jeder Wert lässt sich über Umgebungsvariablen
# überschreiben: ROSTDAV_<ABSCHNITT>__<SCHLÜSSEL>, z. B. ROSTDAV_SERVER__LISTEN.

[server]
# HTTP ohne TLS; im Produktivbetrieb hinter einem Reverse Proxy.
listen = "127.0.0.1:8080"

[storage]
# Enthält blobs/, tmp/, uploads/ und db/. Wird mit Rechten 0700 angelegt.
data_dir = "./data"

[database]
# Ohne Angabe: sqlite://<data_dir>/db/rostdav.sqlite
# url = "sqlite:///srv/rostdav/db/rostdav.sqlite"

[log]
# "json" für den Betrieb, "pretty" für die Entwicklung.
format = "json"
# Filter wie bei RUST_LOG, z. B. "info,rostdav=debug".
level = "info"
