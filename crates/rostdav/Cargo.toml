[package]
name = "rostdav"
description = "Lean file server compatible with the Nextcloud apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["webdav", "nextcloud", "file-server", "self-hosted", "files"]
categories = ["web-programming::http-server", "filesystem"]
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "rostdav"
path = "src/main.rs"

[dependencies]
rostdav-core.workspace = true
rostdav-meta.workspace = true
rostdav-storage.workspace = true
rostdav-app.workspace = true
rostdav-dav.workspace = true
rostdav-compat.workspace = true
rostdav-web.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
figment.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["set-header"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-core.workspace = true
hmac.workspace = true
sha1.workspace = true
percent-encoding.workspace = true
tempfile.workspace = true
zip.workspace = true
http-body-util = "0.1"
quick-xml.workspace = true
httpdate.workspace = true
rostdav-app.workspace = true
figment = { workspace = true, features = ["test"] }

[lints]
workspace = true
