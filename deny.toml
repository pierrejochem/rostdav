# cargo-deny: Sicherheitsmeldungen, Lizenzen und Herkunft der Abhängigkeiten.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Mit MIT OR Apache-2.0 verträgliche Lizenzen. Erweiterungen nur mit Begründung.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
