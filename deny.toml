# cargo-deny: security advisories, licenses and provenance of dependencies.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses compatible with MIT OR Apache-2.0. Extensions only with justification.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # permissive, MIT-like; used by libloading (a dependency of the Turso database engine)
    "ISC",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
