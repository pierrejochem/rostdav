# cargo-deny: security advisories, licenses and provenance of dependencies.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser (unmaintained, no vulnerability) is required by pdf_oxide, which reads text out of
    # PDF files (ADR 0013). It is safe Rust and only ever sees the fonts of uploaded PDFs inside the
    # extractor child process, which has a time and memory limit. Look again when pdf_oxide
    # moves to skrifa.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only; used by pdf_oxide in the sandboxed extractor process" },
]

[licenses]
version = 2
# Licenses compatible with MIT OR Apache-2.0. Extensions only with justification.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # permissive, MIT-like; used by libloading (a dependency of the Turso database engine)
    "ISC",
    # permissive data licence of the Mozilla root certificates (webpki-roots, used by the version check, ADR 0009)
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
