# Rostdav behind Caddy (automatic HTTPS).
#
#   1. Put your domain in the environment:   export ROSTDAV_DOMAIN=files.example.org
#   2. docker compose -f deploy/compose.yaml up -d --build
#   3. docker compose -f deploy/compose.yaml exec rostdav rostdav admin user add alice --admin
#
# With ROSTDAV_DOMAIN unset the site is https://localhost (Caddy's internal CA, for trying it out).
# Ports 80 and 443 must be reachable from the Internet for Let's Encrypt.

services:
  rostdav:
    build:
      context: ..
    restart: unless-stopped
    environment:
      # Only the proxy may say who the client is (X-Forwarded-For); see docs/deployment.md.
      ROSTDAV_SERVER__TRUSTED_PROXIES: '["172.30.0.2"]'
      # The address the apps and browsers use; shown in the Login Flow and in share links.
      ROSTDAV_SERVER__PUBLIC_URL: "https://${ROSTDAV_DOMAIN:-localhost}"
    volumes:
      - rostdav-data:/data
    networks:
      default:
        ipv4_address: 172.30.0.3
    # no published port: only the proxy talks to it

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      rostdav:
        condition: service_healthy
    ports:
      - "${ROSTDAV_HTTP_PORT:-80}:80"
      - "${ROSTDAV_HTTPS_PORT:-443}:443"
    environment:
      ROSTDAV_DOMAIN: "${ROSTDAV_DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.0.2

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  rostdav-data:
  caddy-data:
  caddy-config:
